[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todoy"
version = "0.1.0"
description = "A character that reminds you of today's todos in your terminal and on your desktop"
readme = "README.md"
license = "MIT"
authors = [{ name = "maengyo" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["todo", "reminder", "cli", "tui", "obsidian", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/maengyo/todoy"
Repository = "https://github.com/maengyo/todoy"
Issues = "https://github.com/maengyo/todoy/issues"

[project.scripts]
todoy = "todoy.cli:main"

[project.optional-dependencies]
overlay = ["pyobjc-framework-Cocoa>=10"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/todoy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
