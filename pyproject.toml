[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todoy"
version = "0.1.0"
description = "A character that reminds you of today's todos in your terminal and on your desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
todoy = "todoy.cli:main"

[project.optional-dependencies]
overlay = ["pyobjc-framework-Cocoa>=10"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/todoy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
